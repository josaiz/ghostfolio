<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innovation Night · Portfolio Insights Backlog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #dde1e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      min-height: 100vh;
    }

    /* ── Top bar ── */
    .topbar {
      background: #1a1f35;
      color: white;
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .topbar h1 { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
    .topbar p  { font-size: 11px; color: #7a84a8; margin-top: 2px; }
    .legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #7a84a8; }
    .lswatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .lswatch-orange { background: #F5A623; }
    .lswatch-blue   { background: #5B87C5; }
    .lswatch-green  { background: #5EAB61; }

    /* ── Filter bar ── */
    .filterbar {
      background: #232840;
      padding: 7px 24px;
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid #1a1f35;
    }
    .flabel { font-size: 10px; color: #7a84a8; text-transform: uppercase; letter-spacing: .6px; margin-right: 2px; }
    .fbtn {
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #3a4060;
      background: transparent;
      color: #7a84a8;
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
    }
    .fbtn:hover { border-color: #6366f1; color: #e2e8f0; }
    .fbtn.active { background: rgba(99,102,241,.2); border-color: #6366f1; color: #e2e8f0; }
    .sep { width: 1px; height: 16px; background: #3a4060; margin: 0 4px; }

    /* ── Stats bar ── */
    .statsbar {
      background: #1e2338;
      padding: 5px 24px;
      display: flex;
      gap: 20px;
      font-size: 11px;
      color: #7a84a8;
      flex-wrap: wrap;
    }
    .statsbar strong { color: #e2e8f0; }

    /* ── Board wrap ── */
    .board-wrap { overflow-x: auto; padding: 20px 24px 32px; }

    /* ── Board ── */
    .board {
      min-width: 860px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 18px rgba(0,0,0,.18);
      overflow: hidden;
    }

    /* ── Section header row ── */
    .col-headers {
      display: grid;
      grid-template-columns: 118px 1fr 1fr 260px;
    }
    .ch-spacer {
      background: #eef0f5;
      border-right: 2px solid #d0d5e0;
      border-bottom: 3px solid #c0c6d4;
    }
    .ch {
      padding: 15px 20px;
      text-align: center;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      border-right: 2px solid rgba(0,0,0,.1);
      border-bottom: 3px solid rgba(0,0,0,.12);
    }
    .ch.ch-examples    { background: #F5A623; color: #3D1E00; }
    .ch.ch-proposed    { background: #5B87C5; color: #ffffff; }
    .ch.ch-imagination { background: #5EAB61; color: #ffffff; }

    /* ── Swimlane row ── */
    .lane-row {
      display: grid;
      grid-template-columns: 118px 1fr 1fr 260px;
      min-height: 150px;
      border-bottom: 2px solid #d0d5e0;
    }
    .lane-row:last-child { border-bottom: none; }

    /* ── Arrow label cell ── */
    .lane-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 6px;
      background: #eef0f5;
      border-right: 2px solid #d0d5e0;
    }
    .arrow-shape {
      background: #4A88C4;
      color: white;
      font-weight: 800;
      font-size: 10.5px;
      letter-spacing: .7px;
      text-transform: uppercase;
      line-height: 1.3;
      text-align: center;
      /* pentagon pointing right */
      padding: 9px 26px 9px 10px;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);
      width: 100%;
    }

    /* ── Cards cell ── */
    .lane-section {
      padding: 10px 10px 12px;
      border-right: 2px solid #d0d5e0;
    }
    .lane-section:last-child { border-right: none; }
    .lane-section.sec-examples    { background: #FFFBF0; }
    .lane-section.sec-proposed    { background: #F0F5FC; }
    .lane-section.sec-imagination { background: #F0F9F0; }

    .cards-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
    }

    /* ── Card base ── */
    .card {
      border-radius: 5px;
      padding: 9px 10px;
      box-shadow: 1px 2px 6px rgba(0,0,0,.13);
      width: 178px;
      cursor: pointer;
      transition: box-shadow .15s, transform .12s;
      position: relative;
    }
    .card:hover { box-shadow: 2px 4px 12px rgba(0,0,0,.22); transform: translateY(-1px); }

    /* ── Copy button ── */
    .copy-btn {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,.15);
      background: rgba(255,255,255,.7);
      color: #666;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .15s, background .15s, color .15s;
      z-index: 5;
    }
    .card:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: white; color: #222; border-color: rgba(0,0,0,.3); }
    .copy-btn.copied { background: #22c55e; border-color: #22c55e; color: white; opacity: 1; }

    /* EXAMPLES card — warm cream */
    .card-ex {
      background: #FFF8D6;
      border: 1px solid #E8C840;
    }
    /* PROPOSED card — light blue */
    .card-pr {
      background: #DCEcF9;
      border: 1px solid #90BBE0;
    }

    .card-author {
      font-size: 9.5px;
      font-weight: 700;
      color: #666;
      padding-bottom: 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(0,0,0,.09);
    }
    .card-id {
      font-size: 10px;
      font-weight: 800;
      color: #333;
      letter-spacing: .3px;
      margin-bottom: 2px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #111;
      line-height: 1.35;
      margin-bottom: 5px;
    }
    .card-tags {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }
    .ctag {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(0,0,0,.08);
      color: #555;
    }
    .ctag.low  { background: rgba(134,239,172,.35); color: #14532d; }
    .ctag.med  { background: rgba(252,211,77,.35);  color: #713f12; }
    .ctag.high { background: rgba(248,113,113,.35); color: #7f1d1d; }
    .card-goal { font-size: 10px; color: #555; line-height: 1.4; }

    /* ── Expanded detail ── */
    .card-detail { display: none; margin-top: 7px; padding-top: 7px; border-top: 1px solid rgba(0,0,0,.1); }
    .card.open .card-detail { display: block; }
    .card.open {
      width: auto;
      min-width: 178px;
      max-width: 310px;
      z-index: 20;
      box-shadow: 3px 6px 20px rgba(0,0,0,.28);
    }
    .drow { display: flex; gap: 5px; margin-bottom: 4px; font-size: 10px; }
    .dlabel { min-width: 62px; font-weight: 700; color: #888; flex-shrink: 0; }
    .dval { color: #222; line-height: 1.4; }
    .dval code {
      background: rgba(0,0,0,.06);
      border-radius: 2px;
      padding: 0 3px;
      font-family: 'SF Mono', monospace;
      font-size: 9px;
    }
    .dep-chip {
      display: inline-block;
      font-size: 9px;
      padding: 0 4px;
      border-radius: 3px;
      background: rgba(74,136,196,.18);
      color: #1a5a9e;
      margin: 1px 2px 0 0;
    }
    .hint-box {
      background: rgba(0,0,0,.05);
      border-radius: 3px;
      padding: 5px 7px;
      font-size: 10px;
      color: #555;
      margin-top: 5px;
      line-height: 1.4;
    }
    .hint-box b { color: #b45309; }

    /* ── Placeholder cards ── */
    .card-placeholder {
      background: #C5E8C7;
      border: 1px dashed #74B876;
      border-radius: 5px;
      width: 178px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2E7D32;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .2px;
    }

    /* ── Visibility ── */
    .card.hidden { display: none; }
    .lane-row[data-visible="0"] { display: none; }
  </style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Portfolio Insights Assistant — Innovation Night Backlog</h1>
    <p>7 swimlanes · 16 tasks · Ghostfolio + OpenCode · click a card to expand</p>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="lswatch lswatch-orange"></div>Resolved (Examples)</div>
    <div class="legend-item"><div class="lswatch lswatch-blue"></div>Tooling ready (Build it)</div>
    <div class="legend-item"><div class="lswatch lswatch-green"></div>Your ideas</div>
  </div>
</div>

<div class="filterbar">
  <span class="flabel">Filter</span>
  <button class="fbtn active" data-filter="all">All</button>
  <button class="fbtn" data-filter="examples">Examples</button>
  <button class="fbtn" data-filter="proposed">Proposed</button>
  <div class="sep"></div>
  <button class="fbtn" data-filter="low">Low</button>
  <button class="fbtn" data-filter="medium">Medium</button>
  <button class="fbtn" data-filter="high">High</button>
</div>

<div class="statsbar" id="statsbar"></div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<script>
const SWIMLANES = [
  'Foundation',
  'Frontend',
  'Backend',
  'Domain & Data',
  'MCP',
  'Safety & Review',
  'Integration',

const CARDS = [
  { id:'FND-01', swimlane:'Foundation',      status:'examples', team:'Any',                  diff:'low',    time:20, concept:'Command + Agent',
    title:'Technical map of Ghostfolio',
    goal:'Understand where everything lives so nothing breaks when building insights.',
    deliverable:'Technical map (files, contracts, endpoints, risks) of the portfolio/insights area.',
    agentCmd:'/workshop-inspect-architecture → ghostfolio-architect agent',
    deps:[], acceptance:'Document with verified real paths and the recommended planning command.',
    hint:'Start from docs/workshop/architecture-notes.md; ask the agent to confirm paths with grep.' },

  { id:'FND-02', swimlane:'Foundation',      status:'examples', team:'Data/Domain',           diff:'medium', time:30, concept:'Skill + Agent + MCP',

    deps:['portfolio-insights-feature.md'], acceptance:'Plan with standalone component (home-overview pattern), how it consumes DataService.fetchPortfolioInsights, inline mounting and validation (npx nx run client:build:development-en).',

  { id:'P2-FE-02', swimlane:'Frontend',    status:'proposed', team:'Frontend',              diff:'high',   time:50, concept:'Command + Agent + Skill + Safety',
    title:'Implementation: widget Portfolio Insights',

    deliverable:'Visible widget consuming GET /api/v1/portfolio-insights.',
    agentCmd:'/workshop-implement-frontend-slice P2-FE-02 → frontend-angular-agent + angular-nx-development + product-slice-delivery; text reviewed with /workshop-review-financial-safety',

  { id:'FE-03', swimlane:'Frontend',         status:'examples', team:'Frontend',              diff:'medium', time:35, concept:'Command + Agent + Safety',

// ── Helpers ────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function diffClass(d) {
  return d === 'low' ? 'low' : d === 'medium' ? 'med' : 'high';
}
function diffLabel(d) {
  return d === 'low' ? 'Low' : d === 'medium' ? 'Med' : 'High';
}

function cardHtml(c) {
  const cls = c.status === 'examples' ? 'card-ex' : 'card-pr';
  const deps = c.deps.length
    ? c.deps.map(d => `<span class="dep-chip">${d}</span>`).join('')
    : '<span style="color:#aaa;font-size:9px">—</span>';

  return `
    <div class="card ${cls}"
         data-id="${c.id}"
         data-status="${c.status}"
         data-diff="${c.diff}"
         onclick="toggleCard(this)">
      <button class="copy-btn" title="Copy card" onclick="copyCard('${c.id}',event)">⎘</button>
      <div class="card-author">${esc(c.team)}</div>
      <div class="card-id">${c.id}</div>
      <div class="card-title">${esc(c.title)}</div>
      <div class="card-tags">
        <span class="ctag ${diffClass(c.diff)}">${diffLabel(c.diff)}</span>
        <span class="ctag">${c.time} min</span>
        <span class="ctag">${esc(c.concept)}</span>
      </div>
      <div class="card-goal">${esc(c.goal)}</div>
      <div class="card-detail">
        <div class="drow"><span class="dlabel">Deliverable</span><span class="dval">${esc(c.deliverable)}</span></div>
        <div class="drow"><span class="dlabel">Agent cmd</span><span class="dval"><code>${esc(c.agentCmd)}</code></span></div>
        <div class="drow"><span class="dlabel">Acceptance</span><span class="dval">${esc(c.acceptance)}</span></div>
        <div class="drow"><span class="dlabel">Deps</span><span class="dval">${deps}</span></div>
        <div class="hint-box"><b>Hint:</b> ${esc(c.hint)}</div>
      </div>
    </div>`;
}

function toggleCard(el) {
  el.classList.toggle('open');
}

function copyCard(id, event) {
  event.stopPropagation();
  const c = CARDS.find(x => x.id === id);
  if (!c) return;
  const deps = c.deps.length ? c.deps.join(', ') : '—';
  const text = [
    `${c.id} — ${c.title}`,
    `Team: ${c.team} | ${c.diff.charAt(0).toUpperCase()+c.diff.slice(1)} | ${c.time} min | ${c.concept}`,
    ``,
    `Goal: ${c.goal}`,
    `Deliverable: ${c.deliverable}`,
    `Agent cmd: ${c.agentCmd}`,
    `Deps: ${deps}`,
    `Acceptance: ${c.acceptance}`,
    `Hint: ${c.hint}`,
  ].join('\n');

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector(`.card[data-id="${id}"] .copy-btn`);
    if (!btn) return;
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '⎘'; btn.classList.remove('copied'); }, 1500);
  });
}

// ── Render ─────────────────────────────────────────────────────────────────

function render() {
  const board = document.getElementById('board');

  // Section headers
  let html = `
    <div class="col-headers">
      <div class="ch-spacer"></div>
      <div class="ch ch-examples">EXAMPLES</div>
      <div class="ch ch-proposed">PROPOSED TASKS</div>
      <div class="ch ch-imagination">USE YOUR IMAGINATION</div>
    </div>`;

  // Swimlane rows
  SWIMLANES.forEach(lane => {
    const ex  = CARDS.filter(c => c.swimlane === lane && c.status === 'examples');
    const pr  = CARDS.filter(c => c.swimlane === lane && c.status === 'proposed');

    const exCards  = ex.map(cardHtml).join('');
    const prCards  = pr.map(cardHtml).join('');
    const ph1 = `<div class="card-placeholder">Add text</div>`;
    const ph2 = `<div class="card-placeholder">Add text</div>`;

    html += `
      <div class="lane-row" data-lane="${lane}">
        <div class="lane-label">
          <div class="arrow-shape">${lane}</div>
        </div>
        <div class="lane-section sec-examples">
          <div class="cards-flex">${exCards}</div>
        </div>
        <div class="lane-section sec-proposed">
          <div class="cards-flex">${prCards}</div>
        </div>
        <div class="lane-section sec-imagination">
          <div class="cards-flex">${ph1}${ph2}</div>
        </div>
      </div>`;
  });

  board.innerHTML = html;
}

// ── Filter ─────────────────────────────────────────────────────────────────

let activeFilter = 'all';

function matchesFilter(card, filter) {
  if (filter === 'all')      return true;
  if (filter === 'examples') return card.dataset.status === 'examples';
  if (filter === 'proposed') return card.dataset.status === 'proposed';
  if (filter === 'low')      return card.dataset.diff === 'low';
  if (filter === 'medium')   return card.dataset.diff === 'medium';
  if (filter === 'high')     return card.dataset.diff === 'high';
  return true;
}

function applyFilter(filter) {
  const allCards = document.querySelectorAll('.card');
  allCards.forEach(el => {
    el.classList.toggle('hidden', !matchesFilter(el, filter));
  });

  // Hide lane row if it has no visible product cards (ignore placeholders)
  document.querySelectorAll('.lane-row').forEach(row => {
    const visible = row.querySelectorAll('.card:not(.hidden)').length;
    row.dataset.visible = visible;
    row.style.display = visible === 0 ? 'none' : '';
  });

  updateStats(filter);
}

function updateStats(filter) {
  const visible = CARDS.filter(c => {
    const el = document.querySelector(`.card[data-id="${c.id}"]`);
    return el && !el.classList.contains('hidden');
  });
  const ex = visible.filter(c => c.status === 'examples').length;
  const pr = visible.filter(c => c.status === 'proposed').length;
  const mins = visible.reduce((s,c) => s + c.time, 0);
  document.getElementById('statsbar').innerHTML = `
    <span>Showing <strong>${visible.length}</strong> of ${CARDS.length} tasks</span>
    <span>Examples: <strong>${ex}</strong></span>
    <span>Proposed: <strong>${pr}</strong></span>
    <span>Total time: <strong>${mins} min</strong></span>`;
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.fbtn');
  if (!btn) return;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  applyFilter(activeFilter);
});

// ── Init ───────────────────────────────────────────────────────────────────
render();
applyFilter('all');
</script>
</body>
</html>
